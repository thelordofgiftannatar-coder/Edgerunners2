async function id3(f){try{const b=new Uint8Array(await f.slice(0,4194304).arrayBuffer());

 const ver=b[3],o={art:null,title:'',artist:'',album:''};if(ver<3)return o;
 const end=Math.min(b.length,10+((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127)));let p=10;
 const txt=(k,e)=>{const lab=['iso-8859-1','utf-16','utf-16be','utf-8'][b[k]]||'utf-8';return new TextDecoder(lab).decode(b.subarray(k+1,e)).replace(/\0+$/,'').replace(/^﻿/,'')};
 while(p+10<end){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
  const sz=ver==4?((b[p+4]&127)<<21|(b[p+5]&127)<<14|(b[p+6]&127)<<7|(b[p+7]&127)):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7]);
  if(!sz||sz<0)break;const fe=Math.min(p+10+sz,b.length);
  if(id=='TIT2')o.title=txt(p+10,fe);else if(id=='TPE1')o.artist=txt(p+10,fe);else if(id=='TALB')o.album=txt(p+10,fe);
  else if(id=='APIC'&&!o.art){let k=p+10;const enc=b[k++];let mime='';while(b[k]&&k<end)mime+=String.fromCharCode(b[k++]);k+=2;
   if(enc==1||enc==2){while(!(b[k]==0&&b[k+1]==0)&&k<end)k+=2;k+=2}else{while(b[k]&&k<end)k++;k++}
   o.art=URL.createObjectURL(new Blob([b.slice(k,fe)],{type:mime.includes('/')?mime:'image/jpeg'}))}
  p+=10+sz}
 return o}catch(e){return null}}

 const k=v.getVideoPlaybackQuality&&v.getVideoPlaybackQuality();if(k)r.push(['Dropped frames',k.droppedVideoFrames+' / '+k.totalVideoFrames]);
 if(it.t=='v')r.push(['4K decode',await codecs()]);
 sheet(it.n,'About',it.th,r.map(x=>['',x[0],x[1]]))}

/* ---- sleep timer ---- */
function setSleep(l,min){clearTimeout(slT);slEnd=false;slL=l;
 if(min)slT=setTimeout(()=>{v.pause();slL='Off';toast('Sleep timer ended')},min*6e4);
 else if(l=='End of video')slEnd=true;
 toast(l=='Off'?'Sleep timer off':'Sleep: '+l)}
function sleepMenu(){sheet('Sleep timer','',null,[['Off',0],['15 min',15],['30 min',30],['60 min',60],['End of video',0]].map(([l,m])=>['⏲',l,slL==l?'✓':'',()=>setSleep(l,m)]))}

/* ---- settings ---- */
function cyc(a,x){return a[(a.indexOf(x)+1)%a.length]}
function settings(){const R=(i,t,val,f)=>[i,t,val,()=>{f();applyS();settings()}];
 sheet('Settings','THE WITCHER',null,[
 R('🌗','Mode',S.mode,()=>S.mode=S.mode=='dark'?'light':'dark'),
 R('🎨','Style',S.th,()=>S.th=cyc(Object.keys(TH),S.th)),
 R('🟠','Accent color',ACC[S.acc],()=>S.acc=(S.acc+1)%ACC.length),
 R('▦','List size',{s:'List',m:'Grid',l:'Large'}[S.size],()=>S.size=cyc(['m','s','l'],S.size)),
 R('🌑','Wallpaper dim',Math.round(S.dim*100)+'%',()=>S.dim=S.dim>=.9?0:Math.round((S.dim+.1)*10)/10),
 ['🖼','Set wallpaper','',()=>$('wf').click()],
 ['✖','Remove wallpaper','',()=>{setWP(null);settings()}],
 R('⏭','Auto-play next',S.auto?'On':'Off',()=>S.auto=S.auto?0:1),
 R('⏱','Default speed',S.rate+'x',()=>S.rate=cyc([1,1.25,1.5,2,0.75,0.5],S.rate)),
 ['⏲','Sleep timer',slL,sleepMenu],
 ['♻','Restore removed items',trash.length+'',()=>{if(!trash.length)return toast('Nothing removed');L.push(...trash);trash=[];draw();toast('Restored')}],
 ['👁','Unhide all','',()=>{L.forEach(i=>i.hid=0);draw();toast('All visible')}],
 ['💽','Scan internal storage','',pickStorage],
 ['🔄','Rescan saved folder','',rescan],
 ['💾','Backup settings & playlists','',backup],
 ['📂','Restore backup','',()=>$('rs').click()],
 ['🎞','Codec support','',async()=>{sheet('Codec support','',null,[['','Decoders',await codecs()]],settings)}]],true)}
function backup(){const P={};for(const n in pls)P[n]=pls[n].map(id=>(L.find(i=>i.id==id)||{}).n).filter(Boolean);
 const b=new Blob([JSON.stringify({S,pls:P},null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='the-witcher-backup.json';a.click();toast('Backup saved')}
$('rs').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(d.S)Object.assign(S,d.S);mode=S.play|0;
  if(d.pls)for(const n in d.pls){pls[n]=pls[n]||[];d.pls[n].forEach(nm=>{const it=L.find(i=>i.n==nm);if(it){if(!pls[n].includes(it.id))pls[n].push(it.id)}else(pend[n]=pend[n]||[]).push(nm)})}
  applyS();draw();toast('Backup restored')}catch(x){toast('Invalid backup file')}};
$('cfg').onclick=settings;

/* ---- lock-screen / notification controls (Media Session) ---- */
let pst=0;
function mpos(){if(!('mediaSession' in navigator)||!v.duration||Date.now()-pst<1000)return;pst=Date.now();
 try{navigator.mediaSession.setPositionState({duration:v.duration,position:Math.min(v.currentTime,v.duration),playbackRate:v.playbackRate||1})}catch(e){}}
function ms(){if(!('mediaSession' in navigator)||!cur)return;const m=navigator.mediaSession;
 try{m.metadata=new MediaMetadata({title:cur.tt||cur.n,artist:cur.ar||'',album:cur.al||cur.f||'',artwork:cur.th?[{src:cur.th,sizes:'512x512'}]:[]})}catch(e){}
 const h={play:()=>v.play(),pause:()=>v.pause(),stop:()=>{v.pause();v.currentTime=0},previoustrack:()=>nxt(-1),nexttrack:()=>nxt(1),
  seekbackward:d=>{v.currentTime-=(d&&d.seekOffset)||10},seekforward:d=>{v.currentTime+=(d&&d.seekOffset)||10},
  seekto:d=>{if(d.fastSeek&&v.fastSeek)v.fastSeek(d.seekTime);else v.currentTime=d.seekTime}};
 for(const a in h){try{m.setActionHandler(a,h[a])}catch(e){}}
 m.playbackState=v.paused?'paused':'playing'}

/* ---- internal storage access ---- */
const FSA=!!window.showDirectoryPicker;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('lp',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const idbSet=async(k,x)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(x,k);t.oncomplete=()=>r();t.onerror=()=>r()})};
const idbGet=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
async function walk(d,path,out){for await(const [n,h] of d.entries()){if(h.kind=='directory'){if(!n.startsWith('.')&&n!='Android')await walk(h,path+'/'+n,out)}else if(MEDIA.test(n))out.push([h,path])}}
async function scanDir(h){toast('Scanning '+h.name+'…');const out=[],fs=[];await walk(h,h.name,out);
 for(const [fh,pa2] of out){try{const f=await fh.getFile();f._rel=pa2+'/'+f.name;fs.push(f)}catch(e){}}
 add(fs);tab='f';setTab();toast(fs.length+' files found')}
async function pickStorage(){if(FSA){try{const h=await showDirectoryPicker({mode:'read',startIn:'music'});try{await idbSet('dir',h)}catch(e){}await scanDir(h)}catch(e){if(e.name!='AbortError')toast('Could not open that folder')}}else $('fd').click()}
async function rescan(){try{const h=await idbGet('dir');if(!h)return toast(FSA?'No saved folder yet':'Not supported in this browser');if((await h.requestPermission({mode:'read'}))!='granted')return toast('Permission denied');await scanDir(h)}catch(e){toast('Could not rescan')}}
(async()=>{try{if(!FSA)return;const h=await idbGet('dir');if(h&&(await h.queryPermission({mode:'read'}))=='granted')scanDir(h)}catch(e){}})();

initIcons();applyS();draw();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
